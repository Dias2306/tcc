<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postar atividade</title>
<style>
  :root {
    --azul: #242D66;
    --preto: #000000;
    --branco: #FFFFFF;
    --azul-vivo: #1D91F2;
    --azul-profundo: #11194D;
    --texto-suave: #A9B5D6;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background-color: var(--preto);
    color: var(--branco);
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 50px 25px;
  }

  /* Equivalente ao .card-formulario */
  .caixa {
    width: 100%;
    max-width: 650px;
    padding: 40px;
    background: linear-gradient(
      145deg,
      rgba(42, 58, 107, 0.45),
      rgba(8, 10, 36, 0.95)
    );
    border: 1px solid rgba(29, 145, 242, 0.35);
    border-right: 4px solid #3936C9;
    border-bottom: 4px solid #3936C9;
    border-radius: 25px;
  }

  /* Cabeçalho interno do card */
  .topo-formulario {
    padding-bottom: 20px;
    margin-bottom: 30px;
    border-bottom: 1px solid rgba(29, 145, 242, 0.35);
  }

  .rotulo {
    color: #AFC8F5;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h2 {
    color: var(--branco);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    font-weight: normal;
  }

  /* Campos e labels */
  label {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 22px;
    color: #AFC8F5;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    width: 100%;
    padding: 14px 16px;
    background-color: #070b24;
    color: var(--branco);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    border: 1px solid rgba(29, 145, 242, 0.45);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--azul-vivo);
    box-shadow: 0 0 15px rgba(29, 145, 242, 0.25);
  }

  textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.6;
  }

  /* Deixa o ícone do calendário branco no fundo escuro */
  input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
  }

  /* Estilização das opções do select no tema escuro */
  select option {
    background-color: #070b24;
    color: var(--branco);
  }

  /* Equivalente ao .botao-publicar */
  button {
    width: 100%;
    margin-top: 10px;
    padding: 15px 32px;
    background: linear-gradient(135deg, #1D91F2, #3936C9);
    color: var(--branco);
    font-size: 16px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(29, 145, 242, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(29, 145, 242, 0.55);
  }

  @media (max-width: 650px) {
    .caixa {
      padding: 25px 20px;
    }
  }
</style>
</head>
<body>

<div class="caixa">
  <div class="topo-formulario">
    <p class="rotulo">Painel do Professor</p>
    <h2>Postar atividade</h2>
  </div>

  <form method="post">

    <label>Turma e matéria
      <select name="id_ptm" required>
        <option value="">Selecione...</option>
        <!-- por enquanto são opções de teste; no passo 3 vêm do banco -->
        <option value="1">DS-2A — Programação Web</option>
        <option value="2">DS-3B — Banco de Dados</option>
      </select>
    </label>

    <label>Título
      <input name="titulo" maxlength="150" required>
    </label>

    <label>Descrição
      <textarea name="descricao"></textarea>
    </label>

    <label>Prazo de entrega (opcional)
      <input name="prazo" type="datetime-local">
    </label>

    <button type="submit">Postar</button>

  </form>
</div>

</body>
</html>
